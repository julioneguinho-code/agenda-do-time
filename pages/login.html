<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda do Time — Entrar</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--txt:#1a1a18;--mut:#8a887f;--acc:#185FA5;--accbg:#E6F1FB;--bord:#e4e2db;--r:14px}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid var(--bord);border-radius:20px;padding:32px 24px;width:100%;max-width:380px}
.logo{width:52px;height:52px;border-radius:14px;background:var(--accbg);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px}
h1{font-size:20px;font-weight:600;text-align:center}
p.sub{font-size:13px;color:var(--mut);text-align:center;margin:4px 0 24px}
label{font-size:13px;color:var(--mut);display:block;margin:14px 0 6px}
input{width:100%;padding:13px 14px;border:1px solid var(--bord);border-radius:var(--r);font-size:15px;background:#fbfaf8}
input:focus{outline:none;border-color:var(--acc)}
button{width:100%;margin-top:22px;padding:14px;border:none;border-radius:var(--r);background:var(--acc);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button:active{transform:scale(.98)}
.erro{display:none;background:#FCEBEB;color:#791F1F;font-size:13px;padding:10px 12px;border-radius:10px;margin-top:14px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="logo">📅</div>
  <h1>Agenda do Time</h1>
  <p class="sub">Gestão de agenda e execução — Ademicon</p>
  <form id="f">
    <label>Usuário</label>
    <input type="text" id="email" placeholder="seu usuário" required autocomplete="username" autocapitalize="none">
    <label>Senha</label>
    <div style="position:relative">
      <input type="password" id="senha" placeholder="••••••••" required autocomplete="current-password" style="padding-right:46px">
      <button type="button" onclick="const s=document.getElementById('senha');s.type=s.type==='password'?'text':'password';this.textContent=s.type==='password'?'👁':'🙈'" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);width:auto;margin:0;padding:6px 8px;background:transparent;border:none;font-size:16px;cursor:pointer">👁</button>
    </div>
    <div class="erro" id="erro"></div>
    <button type="submit">Entrar</button>
  </form>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const erro = document.getElementById('erro');
  erro.style.display = 'none';
  const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email: email.value, senha: senha.value }) });
  const json = await res.json();
  if (!res.ok) { erro.textContent = json.erro || 'Falha no login'; erro.style.display = 'block'; return; }
  location.href = json.papel === 'gestor' ? '/gestor' : '/app';
});
</script>
</body>
</html>
