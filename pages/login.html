<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda do Time — Entrar</title>
<style>
:root{--bg:#E8E9EC;--card:#FFFFFF;--txt:#23272F;--mut:#7B828C;--acc:#D62839;--acc2:#B71F2E;--accbg:rgba(214,40,57,.10);--bord:#E1E3E7;--r:14px;color-scheme:light}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid var(--bord);border-radius:22px;padding:34px 26px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.10)}
.logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff;margin:0 auto 16px;box-shadow:0 8px 24px rgba(228,0,43,.4)}
h1{font-size:21px;font-weight:700;text-align:center;letter-spacing:-.3px}
p.sub{font-size:13px;color:var(--mut);text-align:center;margin:5px 0 26px}
label{font-size:13px;color:var(--mut);display:block;margin:14px 0 6px}
input{width:100%;padding:13px 14px;border:1px solid var(--bord);border-radius:var(--r);font-size:15px;background:#F7F8FA;color:var(--txt)}
input::placeholder{color:#9CA3AF}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
button{width:100%;margin-top:24px;padding:14px;border:none;border-radius:var(--r);background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 8px 22px rgba(228,0,43,.35)}
button:active{transform:scale(.98)}
.erro{display:none;background:var(--accbg);color:#B91C1C;font-size:13px;padding:10px 12px;border-radius:10px;margin-top:14px;text-align:center;border:1px solid rgba(228,0,43,.25)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">A</div>
  <h1>Agenda do Time</h1>
  <p class="sub">Gestão de agenda e execução — Ademicon</p>
  <form id="f">
    <label>Usuário</label>
    <input type="text" id="email" placeholder="seu usuário" required autocomplete="username" autocapitalize="none">
    <label>Senha</label>
    <div style="position:relative">
      <input type="password" id="senha" placeholder="••••••••" required autocomplete="current-password" style="padding-right:46px">
      <button type="button" onclick="const s=document.getElementById('senha');s.type=s.type==='password'?'text':'password';this.textContent=s.type==='password'?'👁':'🙈'" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);width:auto;margin:0;padding:6px 8px;background:transparent;border:none;font-size:16px;cursor:pointer;box-shadow:none">👁</button>
    </div>
    <div class="erro" id="erro"></div>
    <button type="submit">Entrar</button>
  </form>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const erro = document.getElementById('erro');
  erro.style.display = 'none';
  const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email: email.value, senha: senha.value }) });
  const json = await res.json();
  if (!res.ok) { erro.textContent = json.erro || 'Falha no login'; erro.style.display = 'block'; return; }
  location.href = json.papel === 'gestor' ? '/gestor' : '/app';
});
</script>
</body>
</html>
